name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 1. Secret se direct key decode karna (Cache aur Auto-generation hata diya gaya hai)
      - name: Decode Keystore from Secrets
        shell: bash
        run: |
          set -eo pipefail
          echo "Checking secret availability..."
          if [ -z "${{ secrets.RELEASE_KEY_JKS_BASE64 }}" ]; then
            echo "Error: RELEASE_KEY_JKS_BASE64 secret is missing!"
            exit 1
          fi
          mkdir -p app
          echo "Decoding release keystore..."
          echo "${{ secrets.RELEASE_KEY_JKS_BASE64 }}" | base64 --decode > app/my-release-key.jks
          echo "Keystore successfully decoded."

      # 2. Build Signed Release APK
      - name: Build Signed Release APK
        env:
          KEY_ALIAS: '${{ secrets.RELEASE_KEY_ALIAS }}'
          STORE_PASS: '${{ secrets.RELEASE_STORE_PASSWORD }}'
          KEY_PASS: '${{ secrets.RELEASE_KEY_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}'
        run: |
          set -eo pipefail
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/app/my-release-key.jks" \
              -Pandroid.injected.signing.store.password="$STORE_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS" \
              --stacktrace --console=plain 2>&1 | tee build-error.log
          else
            gradle assembleRelease \
              -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/app/my-release-key.jks" \
              -Pandroid.injected.signing.store.password="$STORE_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS" \
              --stacktrace --console=plain 2>&1 | tee build-error.log
          fi

      # 3. VirusTotal Scan & Appeal Data Generator
      - name: VirusTotal Scan & Appeal Data Generator
        env:
          VT_API_KEY: '${{ secrets.VIRUSTOTAL_API_KEY }}'
          NTFY_TOPIC: '${{ secrets.NTFY_TOPIC }}'
          RELEASE_STORE_PASSWORD: '${{ secrets.RELEASE_STORE_PASSWORD }}'
          RELEASE_KEY_ALIAS: '${{ secrets.RELEASE_KEY_ALIAS }}'
        run: |
          python3 - << 'EOF'
          import os, glob, subprocess, re, json, hashlib, urllib.request, sys

          try:
              apk_paths = glob.glob("app/build/outputs/apk/release/*.apk") + glob.glob("**/*.apk", recursive=True)
              if not apk_paths:
                  print("Error: APK not found!")
                  sys.exit(1)
              apk_path = apk_paths[0]
              print(f"Found APK at: {apk_path}")

              sha256_hash = hashlib.sha256()
              with open(apk_path, "rb") as f:
                  for byte_block in iter(lambda: f.read(4096), b""):
                      sha256_hash.update(byte_block)
              apk_sha256 = sha256_hash.hexdigest()

              package_name = "com.unknown.app"
              try:
                  with open("app/build.gradle", "r") as f:
                      match = re.search(r"applicationId\s+[\"'\x27]([a-zA-Z0-9_.]+)", f.read())
                      if match:
                          package_name = match.group(1)
              except Exception as e:
                  print(f"Could not read build.gradle: {e}")

              keystore_path = "app/my-release-key.jks"
              store_pass = os.environ.get("RELEASE_STORE_PASSWORD", "")
              key_alias = os.environ.get("RELEASE_KEY_ALIAS", "")

              key_sha1 = "N/A"
              key_sha256 = "N/A"
              try:
                  cmd = ["keytool", "-list", "-v", "-keystore", keystore_path, "-alias", key_alias, "-storepass", store_pass]
                  output = subprocess.check_output(cmd, stderr=subprocess.STDOUT).decode("utf-8")
                  for line in output.splitlines():
                      if "SHA1:" in line:
                          key_sha1 = line.split("SHA1:")[1].strip()
                      if "SHA256:" in line:
                          key_sha256 = line.split("SHA256:")[1].strip()
              except Exception as e:
                  print(f"Error extracting keystore certs: {e}")

              vt_link = "API Key not configured"
              vt_api_key = os.environ.get("VT_API_KEY", "")
              if vt_api_key:
                  print("Uploading APK to VirusTotal...")
                  try:
                      curl_cmd = [
                          "curl", "--request", "POST",
                          "--url", "https://www.virustotal.com/api/v3/files",
                          "--header", f"x-apikey: {vt_api_key}",
                          "--form", f"file=@{apk_path}"
                      ]
                      res = subprocess.check_output(curl_cmd).decode("utf-8")
                      res_json = json.loads(res)
                      analysis_id = res_json.get("data", {}).get("id")
                      if analysis_id:
                          vt_link = f"https://www.virustotal.com/gui/file/{apk_sha256}"
                      else:
                          vt_link = "Upload failed or limit reached"
                  except Exception as e:
                      print(f"VT upload error: {e}")
                      vt_link = "Upload failed"

              print("\n" + "="*50)
              print("          NOTIFICATION & APPEAL DATA SUMMARY")
              print("="*50)
              print(f"Package Name    : {package_name}")
              print(f"APK SHA256      : {apk_sha256}")
              print(f"Keystore SHA1   : {key_sha1}")
              print(f"Keystore SHA256 : {key_sha256}")
              print(f"VirusTotal Link : {vt_link}")
              print("="*50 + "\n")

              ntfy_topic = os.environ.get("NTFY_TOPIC", "")
              if ntfy_topic:
                  print("Sending details to ntfy.sh...")
                  msg = f"Pkg: {package_name}\nAPK SHA256: {apk_sha256}\nKey SHA1: {key_sha1}\nKey SHA256: {key_sha256}\nVT: {vt_link}"
                  try:
                      req = urllib.request.Request(
                          f"https://ntfy.sh/{ntfy_topic}",
                          data=msg.encode("utf-8"),
                          headers={"Title": "APK Build & Appeal Data"}
                      )
                      urllib.request.urlopen(req)
                      print("Notification sent successfully!")
                  except Exception as e:
                      print(f"Failed to send ntfy notification: {e}")
              else:
                  print("NTFY_TOPIC secret is missing, skipping notification.")
          except Exception as err:
              print(f"Critical error in Python script: {err}")
              sys.exit(1)
          EOF

      # 4. Upload Release APK
      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: '**/*.apk'

      # 5. Upload Build Logs
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-error.log

